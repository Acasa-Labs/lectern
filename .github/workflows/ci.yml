name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build (Apple silicon and Intel)
        run: |
          BINARY="$(scripts/build-universal.sh)"
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
      - name: Assemble the app
        run: |
          APP="$(scripts/assemble.sh "$BINARY" "$RUNNER_TEMP")"
          codesign --force --sign - --entitlements Lectern.entitlements "$APP"
          codesign --verify --strict "$APP"
